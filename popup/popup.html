<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Classic Skin - Songsterr Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="titlebar">
    <img src="../icons/icon32.png" width="16" height="16" alt="">
    <h1>Classic Skin - Extension for Songsterr</h1>
    <span id="version" class="version muted"></span>
  </header>

  <form id="settings" class="panel" autocomplete="off">
    <fieldset class="row">
      <legend>Reskin</legend>
      <div class="seg" role="radiogroup" aria-label="Reskin">
        <label><input type="radio" name="enabled" value="true"><span>On</span></label>
        <label><input type="radio" name="enabled" value="false"><span>Off</span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>Controls</legend>
      <div class="seg" role="radiogroup" aria-label="Player controls layout">
        <label title="Player docked in the bottom-right corner as a compact strip"><input type="radio" name="layout" value="fusion"><span>Fusion</span></label>
        <label title="The older Songsterr player: one full-width bar along the bottom"><input type="radio" name="layout" value="classic"><span>Classic</span></label>
        <label title="The 2023 player: a column of round icon buttons along the right edge"><input type="radio" name="layout" value="minimal"><span>Minimal</span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>Quick menu</legend>
      <div class="seg" role="radiogroup" aria-label="Quick menu layout">
        <label title="Docked bottom-left, icon beside label, collapsible"><input type="radio" name="navLayout" value="fusion"><span>Fusion</span></label>
        <label title="The older Songsterr menu: top right, icon over label"><input type="radio" name="navLayout" value="classic"><span>Classic</span></label>
        <label title="The 2023 menu: a sidebar down the left edge, icon over label"><input type="radio" name="navLayout" value="minimal"><span>Minimal</span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>Bar buttons</legend>
      <div class="seg" role="radiogroup" aria-label="Classic bar buttons">
        <label title="Classic controls: a label under every icon, buttons spaced equally across the bar"><input type="radio" name="classicBar" value="spread"><span>Spread</span></label>
        <label title="Classic controls: icons only, packed to the left"><input type="radio" name="classicBar" value="icons"><span>Icons</span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>Color theme</legend>
      <div class="seg seg-tight" role="radiogroup" aria-label="Accent colour">
        <label title="Blue accents (Fusion's default)"><input type="radio" name="accent" value="blue"><span><i class="swatch" style="--swatch: #3a82e4"></i>Blue</span></label>
        <label title="Green accents (Classic's default, like the old player)"><input type="radio" name="accent" value="green"><span><i class="swatch" style="--swatch: #2f9e44"></i>Green</span></label>
        <label title="Red accents"><input type="radio" name="accent" value="red"><span><i class="swatch" style="--swatch: #d64545"></i>Red</span></label>
        <label title="Pick your own colour"><input type="radio" name="accent" value="custom"><span><i class="swatch" id="custom-swatch"></i>Custom</span></label>
        <label title="No accent colour: neutral greys only"><input type="radio" name="accent" value="off"><span>Off</span></label>
      </div>
    </fieldset>

    <fieldset class="row" id="custom-row" hidden>
      <legend>Custom</legend>
      <div class="color-pick">
        <input type="color" name="accentCustom" aria-label="Custom accent colour">
        <span id="custom-hex" class="muted"></span>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>Theme</legend>
      <div class="seg" role="radiogroup" aria-label="Theme">
        <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
        <label><input type="radio" name="theme" value="light"><span>Light</span></label>
        <label title="Match Songsterr's own theme setting"><input type="radio" name="theme" value="auto"><span>Auto</span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>Density</legend>
      <div class="seg" role="radiogroup" aria-label="Density">
        <label><input type="radio" name="density" value="compact"><span>Compact</span></label>
        <label><input type="radio" name="density" value="comfortable"><span>Comfortable</span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>Author</legend>
      <div class="seg" role="radiogroup" aria-label="Show tab author">
        <label title="Show &quot;Last edited by …&quot; under the song title"><input type="radio" name="showAuthor" value="true"><span>Show</span></label>
        <label><input type="radio" name="showAuthor" value="false"><span>Hide</span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>Nav bar</legend>
      <div class="seg" role="radiogroup" aria-label="Bottom navigation bar">
        <label><input type="radio" name="navCollapsed" value="false"><span>Shown</span></label>
        <label title="Fusion quick menu only. Also toggled by the tab at the bottom-left of the page"><input type="radio" name="navCollapsed" value="true"><span>Collapsed</span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>Player</legend>
      <div class="seg" role="radiogroup" aria-label="Player controls">
        <label><input type="radio" name="paneMinimized" value="false"><span>Full</span></label>
        <label title="Fusion layout only. Keeps just the favourite / display mode / editor strip. Also toggled by the chevron at the end of that strip."><input type="radio" name="paneMinimized" value="true"><span>Minimised</span></label>
      </div>
    </fieldset>

    <fieldset class="row">
      <legend>Stay open</legend>
      <div class="seg" role="radiogroup" aria-label="Keep the player panel open">
        <label title="Fusion layout only. Once you open the player panel, it stays open when you click a button or press play. Only the handle (or dragging) closes it."><input type="radio" name="keepOpen" value="true"><span>On</span></label>
        <label title="Songsterr's own behaviour: the panel folds itself after clicks and on play"><input type="radio" name="keepOpen" value="false"><span>Off</span></label>
      </div>
    </fieldset>

  </form>

  <section class="panel diag">
    <div class="diag-head">
      <button type="button" id="diagnose" class="btn">Check selectors</button>
      <span id="diag-status" class="muted" aria-live="polite"></span>
    </div>
    <div id="diag-results" hidden></div>
  </section>

  <footer class="statusbar muted">Changes apply instantly to open Songsterr tabs.</footer>

  <script src="popup.js"></script>
</body>
</html>
